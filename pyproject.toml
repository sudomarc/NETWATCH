[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatch-ng"
version = "2.1.1"
description = "Linux TUI for network supervision, identification and administration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
netwatch-ng = "netwatch_ng.__main__:main"

[tool.setuptools.packages.find]
include = ["netwatch_ng*"]

[tool.pytest.ini_options]
testpaths = ["tests_ng", "tests_e2e"]
markers = ["e2e: full application flows executed in a pseudo-terminal"]
