name: CI

on:
  push:
    branches: ["main", "fix/**", "feat/**", "v2/**", "test/**"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  legacy:
    if: github.event_name != 'release'
    name: Legacy Bash and TUI checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: bash -n netwatch.sh netwatch-ipv6.sh netwatch-router.sh

      - name: ShellCheck
        run: shellcheck netwatch.sh netwatch-ipv6.sh netwatch-router.sh

      - name: Legacy validation tests
        run: bash tests/test_validation.sh

      - name: Legacy output tests
        run: bash tests/test_output.sh

      - name: Legacy CLI tests
        run: bash tests/test_cli.sh

      - name: Legacy firewall tests
        run: sudo -E bash tests/test_firewall.sh

      - name: Legacy IPv6 tests
        run: sudo -E bash tests/test_ipv6.sh

      - name: Legacy router tests
        run: bash tests/test_router.sh

      - name: TUI syntax
        run: python3 -m py_compile ui/netwatch_tui.py

      - name: TUI regression tests
        run: bash tests/test_tui.sh

  netwatch-ng:
    if: github.event_name != 'release'
    name: NETWATCH NG tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && pip install -e . pytest

      - name: Syntax check
        run: python -m py_compile $(find netwatch_ng -name "*.py")

      - name: Unit tests
        run: python -m pytest tests_ng -v

      - name: End-to-end tests
        run: python -m pytest tests_e2e -v

  debian-package:
    if: github.event_name != 'release'
    name: Debian package smoke test (${{ matrix.distribution }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Debian 12 (Bookworm)
            image: debian:bookworm-slim
          - distribution: Debian 13 (Trixie)
            image: debian:trixie-slim
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates build-essential dpkg-dev debhelper dh-python \
            pybuild-plugin-pyproject python3-all python3-setuptools \
            python3-pytest iproute2 util-linux

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run NETWATCH NG unit tests
        run: |
          python3 -m py_compile $(find netwatch_ng -name "*.py")
          python3 -m pytest tests_ng -q

      - name: Build Debian binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Install and smoke-test package
        run: |
          set -eu
          mkdir -p dist
          cp ../netwatch-ng_*.deb dist/
          dpkg-deb --info dist/netwatch-ng_*.deb
          apt-get install -y ./dist/netwatch-ng_*.deb
          command -v netwatch-ng
          test -x "$(command -v netwatch-ng)"
          python3 -c "import netwatch_ng"
          dpkg-query -W netwatch-ng
          printf 'q' | script -q -e -c 'TERM=xterm-256color netwatch-ng' /dev/null
          apt-get remove -y netwatch-ng

publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v2.') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Debian build and repository tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper dh-python devscripts \
            pybuild-plugin-pyproject python3-all python3-setuptools \
            python3-pytest iproute2 apt-utils gnupg ca-certificates

      - name: Validate release metadata and run all NETWATCH NG tests
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEBFULLNAME: NETWATCH NG maintainers
          DEBEMAIL: 177128114+sudomarc@users.noreply.github.com
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-stable or malformed release tag: $RELEASE_TAG"
            exit 1
          fi
          VERSION="$(printf '%s' "$RELEASE_TAG" | cut -c2-)"

          # Align setuptools metadata with the release tag in this temporary
          # Actions checkout; no repository file is rewritten.
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          path = Path("pyproject.toml")
          source = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              source,
          )
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one project version in {path}, found {count}"
              )
          path.write_text(updated, encoding="utf-8")
          print(f"Set Python package version to {version}")
          PY

          echo "NETWATCH_VERSION=$VERSION" >> "$GITHUB_ENV"
          dch --newversion "$VERSION-1" --distribution stable \
            --force-distribution "NETWATCH NG $VERSION release."

          python3 -m py_compile $(find netwatch_ng -name "*.py")
          python3 -m pytest tests_ng -q
          python3 -m pytest tests_e2e -q

      - name: Build and verify Debian package version
        run: |
          set -euo pipefail
          dpkg-buildpackage -us -uc -b
          mkdir -p public/pool/main
          PACKAGE="$(find .. -maxdepth 1 -type f -name 'netwatch-ng_*.deb' -print -quit)"
          test -n "$PACKAGE"
          cp "$PACKAGE" public/pool/main/
          dpkg-deb --info "public/pool/main/$(basename "$PACKAGE")"

          ACTUAL_DEB_VERSION="$(dpkg-deb -f "$PACKAGE" Version)"
          EXPECTED_DEB_VERSION="$NETWATCH_VERSION-1"
          test "$ACTUAL_DEB_VERSION" = "$EXPECTED_DEB_VERSION" || {
            echo "Debian package version mismatch: expected $EXPECTED_DEB_VERSION, got $ACTUAL_DEB_VERSION"
            exit 1
          }

          EXTRACT_DIR="$(mktemp -d)"
          trap 'rm -rf "$EXTRACT_DIR"' EXIT
          dpkg-deb -x "$PACKAGE" "$EXTRACT_DIR"
          METADATA="$(find "$EXTRACT_DIR" -type f -path '*/netwatch_ng-*.dist-info/METADATA' -print -quit)"
          test -n "$METADATA"
          grep -Fx "Version: $NETWATCH_VERSION" "$METADATA"

      - name: Generate APT indexes and verify archive signatures
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          test -n "$APT_GPG_PRIVATE_KEY" || { echo "Missing APT_GPG_PRIVATE_KEY secret"; exit 1; }
          test -n "$APT_GPG_KEY_ID" || { echo "Missing APT_GPG_KEY_ID secret"; exit 1; }
          test -n "$APT_GPG_PASSPHRASE" || { echo "Missing APT_GPG_PASSPHRASE secret"; exit 1; }
          [[ "$APT_GPG_KEY_ID" =~ ^[A-Fa-f0-9]{40}$ ]] || {
            echo "APT_GPG_KEY_ID must be the full 40-character primary-key fingerprint"
            exit 1
          }

          SIGN_HOME="$(mktemp -d)"
          VERIFY_HOME="$(mktemp -d)"
          chmod 700 "$SIGN_HOME" "$VERIFY_HOME"
          export GNUPGHOME="$SIGN_HOME"
          cleanup() {
            GNUPGHOME="$SIGN_HOME" gpgconf --kill all >/dev/null 2>&1 || true
            rm -rf -- "$SIGN_HOME" "$VERIFY_HOME"
          }
          trap cleanup EXIT

          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          ACTUAL_FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys "$APT_GPG_KEY_ID" \
            | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          EXPECTED_FINGERPRINT="$(printf '%s' "$APT_GPG_KEY_ID" | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || {
            echo "Imported private key does not match APT_GPG_KEY_ID"
            exit 1
          }

          mkdir -p public/dists/stable/main/binary-amd64
          cd public
          apt-ftparchive packages pool/main > dists/stable/main/binary-amd64/Packages
          gzip -n -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz

          cat > apt-release.conf <<'EOF'
          APT::FTPArchive::Release::Origin "NETWATCH NG";
          APT::FTPArchive::Release::Label "NETWATCH NG";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "NETWATCH NG signed Debian repository";
          EOF
          apt-ftparchive -c=apt-release.conf release dists/stable > dists/stable/Release

          printf '%s\n' "$APT_GPG_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 --local-user "$APT_GPG_KEY_ID" \
            --clearsign --output dists/stable/InRelease dists/stable/Release
          printf '%s\n' "$APT_GPG_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 --local-user "$APT_GPG_KEY_ID" \
            --detach-sign --output dists/stable/Release.gpg dists/stable/Release
          gpg --armor --export "$APT_GPG_KEY_ID" > public.key
          test -s public.key

          # Verify with a separate keyring containing only the exported public key.
          GNUPGHOME="$VERIFY_HOME" gpg --batch --import public.key
          GNUPGHOME="$VERIFY_HOME" gpg --batch --verify dists/stable/Release.gpg dists/stable/Release
          GNUPGHOME="$VERIFY_HOME" gpg --batch --verify dists/stable/InRelease
          touch .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy APT repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
