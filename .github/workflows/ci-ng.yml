name: CI (NETWATCH NG)

on:
  push:
    branches: ["main", "v2/**", "test/**"]
  pull_request:
    paths:
      - "netwatch_ng/**"
      - "tests_ng/**"
      - "tests_e2e/**"
      - "pyproject.toml"
      - ".github/workflows/ci-ng.yml"
      - ".github/workflows/publish-apt.yml"
      - ".github/workflows/validate-apt-signing.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: python -m pip install --upgrade pip && pip install -e . pytest

      - name: Syntax check
        run: python -m py_compile $(find netwatch_ng -name "*.py")

      - name: Unit tests
        run: python -m pytest tests_ng -v

      - name: End-to-end tests
        run: python -m pytest tests_e2e -v
